name: 4 - using actions

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout-latest
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install Dependencies
        run: npm ci
        working-directory: 4-using-actions/my-react-app



